<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orações em Duplas — IBT</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --teal:#1DCACA; --yellow:#F5E06B; --navy:#0D1F3C; --bg:#E8EAED; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:100vw; height:100vh; font-family:'Raleway',sans-serif; overflow:hidden; }

  /* ── TELA 1: Orações em duplas ── */
  #tela1 {
    position:absolute; inset:0;
    background:var(--navy);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:36px;
    opacity:0; transition:opacity 1s ease;
  }
  #tela1.ativa { opacity:1; }

  #tela1 .t1-logo { width:56px; height:auto; opacity:0.85; margin-bottom:8px; }

  #tela1 .t1-tag {
    font-size:1rem; font-weight:600;
    letter-spacing:0.35em; text-transform:uppercase;
    color:var(--teal); opacity:0.8;
  }

  #tela1 .t1-titulo {
    font-size:clamp(3.5rem,9vw,8.5rem);
    font-weight:800; color:#fff;
    text-align:center; line-height:1.1;
    max-width:88vw;
  }
  #tela1 .t1-titulo span { color:var(--teal); }

  #tela1 .t1-barra { width:90px; height:5px; background:var(--yellow); border-radius:3px; }

  #tela1 .t1-sub {
    font-size:clamp(1.4rem,3vw,2.8rem);
    font-weight:300; color:rgba(255,255,255,0.75);
    text-align:center; line-height:1.4;
    max-width:75vw;
  }
  #tela1 .t1-sub strong { color:var(--yellow); font-weight:700; }

  /* ── TELA 2: Mural de Oração ── */
  #tela2 {
    position:absolute; inset:0;
    background:var(--bg);
    display:flex; flex-direction:column;
    opacity:0; transition:opacity 1s ease;
  }
  #tela2.ativa { opacity:1; }

  .top-bar { display:flex; align-items:center; padding:22px 36px 18px; gap:20px; flex-shrink:0; }
  .logo-img { width:42px; height:auto; flex-shrink:0; }
  .top-divider { width:3px; height:44px; background:var(--teal); border-radius:2px; flex-shrink:0; }
  .title { font-size:3rem; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--navy); line-height:1; }
  .title span { color:var(--teal); }

  .card { flex:1; margin:0 28px 28px; background:var(--navy); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; padding:52px 80px; position:relative; opacity:0; transition:opacity 0.8s ease; box-shadow:0 20px 60px rgba(0,0,0,0.16); }
  .card.visible { opacity:1; }
  .card::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:72px; height:4px; background:var(--yellow); border-radius:0 0 4px 4px; }

  .author { font-size:4.5rem; font-weight:800; letter-spacing:0.15em; text-transform:uppercase; color:var(--teal); }
  .request { font-size:1rem; font-weight:300; line-height:1.45; color:#fff; text-align:center; width:100%; word-break:break-word; overflow:hidden; }
  .loading { font-size:1.2rem; font-weight:300; color:rgba(255,255,255,0.35); letter-spacing:0.08em; }

  .bottom-row { display:flex; align-items:center; justify-content:center; padding:0 36px 16px; flex-shrink:0; gap:8px; }
  .counter { font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase; color:#aaa; }
  .counter-dot { width:4px; height:4px; border-radius:50%; background:var(--teal); opacity:0.5; }

  .progress-wrap { position:fixed; bottom:0; left:0; width:100%; height:4px; background:rgba(0,0,0,0.08); }
  .progress-bar { height:100%; background:linear-gradient(to right,var(--navy),var(--teal)); transform-origin:left; }
  @keyframes countdown { from{transform:scaleX(1)} to{transform:scaleX(0)} }
</style>
</head>

<script>
  var SUPABASE_URL   = 'https://vuvijhywbexrakqmdxvt.supabase.co';
  var SUPABASE_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1dmlqaHl3YmV4cmFrcW1keHZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNTU5NTQsImV4cCI6MjA4ODczMTk1NH0.pF2rYFDiiVfeOZOJNaQ6WzYFJ2iXtAoDShYqF7nwEEE';
  var SLIDE_DURATION = 12000;
  var INTRO_DURATION = 8000;
  var REFRESH_MS     = 60000;

  var tela1       = document.getElementById('tela1');
  var tela2       = document.getElementById('tela2');
  var card        = document.getElementById('card');
  var loadingEl   = document.getElementById('loading');
  var contentEl   = document.getElementById('content');
  var authorEl    = document.getElementById('author');
  var requestEl   = document.getElementById('request');
  var counterEl   = document.getElementById('counter');
  var progressBar = document.querySelector('.progress-bar');

  var pedidos = [], current = 0, slideTimer = null;

  function shuffle(a) {
    for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }

  function fetchPedidos() {
    return fetch(SUPABASE_URL+'/rest/v1/rpc/get_public_prayer_requests',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
      body:'{}'
    }).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});
  }

  function startProgress() {
    progressBar.style.animation='none';
    progressBar.offsetHeight;
    progressBar.style.animation='countdown '+SLIDE_DURATION+'ms linear forwards';
  }

  function fitText() {
    var availH = card.clientHeight - 140 - (authorEl.offsetHeight+40);
    var availW = card.clientWidth  - 200;
    requestEl.style.width=availW+'px';
    requestEl.style.fontSize='1px';
    var lo=10,hi=100,best=10;
    for(var i=0;i<30;i++){
      var mid=(lo+hi)/2;
      requestEl.style.fontSize=mid+'px';
      if(requestEl.scrollHeight<=availH){best=mid;lo=mid+0.5;}
      else{hi=mid-0.5;}
    }
    requestEl.style.fontSize=Math.min(best*0.92,90)+'px';
  }

  function showSlide(i) {
    card.classList.remove('visible');
    setTimeout(function(){
      var p=pedidos[i];
      authorEl.textContent  = p.display_author||'Anônimo';
      requestEl.textContent = p.request;
      loadingEl.style.display='none';
      contentEl.style.display='flex';
      counterEl.textContent=(i+1)+' de '+pedidos.length+' pedidos';
      fitText();
      card.classList.add('visible');
      startProgress();
    },700);
  }

  function nextSlide() {
    current=(current+1)%pedidos.length;
    if(current===0){
      // Terminou todos — volta para tela 1
      clearTimeout(slideTimer);
      iniciarFluxo();
      return;
    }
    showSlide(current);
    clearTimeout(slideTimer);
    slideTimer=setTimeout(nextSlide,SLIDE_DURATION);
  }

  function iniciarMural() {
    tela1.classList.remove('ativa');
    tela2.classList.add('ativa');
    fetchPedidos().then(function(dados){
      if(!dados||dados.length===0){
        loadingEl.textContent='Nenhum pedido no momento.';
        loadingEl.style.display='block';
        contentEl.style.display='none';
        card.classList.add('visible');
        return;
      }
      pedidos=shuffle(dados); current=0;
      showSlide(current);
      clearTimeout(slideTimer);
      slideTimer=setTimeout(nextSlide,SLIDE_DURATION);
    }).catch(function(){
      loadingEl.textContent='Erro ao carregar pedidos.';
      loadingEl.style.display='block';
      card.classList.add('visible');
    });
  }

  function iniciarFluxo() {
    // Reset
    tela2.classList.remove('ativa');
    card.classList.remove('visible');
    contentEl.style.display='none';
    loadingEl.style.display='block';
    loadingEl.textContent='Carregando pedidos...';
    progressBar.style.animation='none';

    // Tela 1
    tela1.classList.add('ativa');
    setTimeout(function(){
      iniciarMural();
    }, INTRO_DURATION);
  }

  // Atualização silenciosa em background
  setInterval(function(){
    fetchPedidos().then(function(d){if(d&&d.length>0)pedidos=shuffle(d);}).catch(function(){});
  }, REFRESH_MS);

  iniciarFluxo();
</script>
